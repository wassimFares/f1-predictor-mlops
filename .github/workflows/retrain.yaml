name: Race weekend retrain

on:
  schedule:
    - cron: '0 8 * * 4'  # every Thursday 8am UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit updated data back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache FastF1 data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fastf1-cache-${{ runner.os }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p data/cache

      - name: Collect latest race
        run: python src/collect.py

      - name: Engineer features
        run: python src/features.py

      - name: Train model
        run: python src/train.py

      - name: Evaluate vs champion
        run: python src/evaluate.py

      - name: Commit updated data
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add data/raw/ data/processed/ metrics.json
          git diff --staged --quiet || git commit -m "auto: retrain after race weekend [skip ci]"
          git push